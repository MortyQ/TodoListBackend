services:
  - type: web
    name: todolist-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: "todoapp"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_TTL
        value: "900"
      - key: RATE_LIMIT_LIMIT
        value: "100"

